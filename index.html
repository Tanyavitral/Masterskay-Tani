<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мастерская Тани</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Montserrat,sans-serif;

background:#F8F4EF;

color:#5B5163;

}

header{

padding:35px;

text-align:center;

background:white;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

h1{

font-family:'Great Vibes',cursive;

font-size:52px;

color:#8D6DB6;

}

.subtitle{

margin-top:10px;

color:#999;

}

.avatar{

width:140px;

height:140px;

border-radius:50%;

background:#ddd;

margin:30px auto;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

color:#666;

}

.container{

padding:20px;

}

.button{

display:block;

text-decoration:none;

padding:18px;

margin:15px 0;

border-radius:18px;

background:#E8DDF6;

text-align:center;

font-weight:600;

color:#5B5163;

font-size:18px;

transition:.3s;

}

.button:hover{

background:#DCCAF3;

}

.card{

background:white;

padding:20px;

margin-top:25px;

border-radius:20px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

footer{

margin:40px 0;

text-align:center;

color:#999;

font-size:14px;

}

</style>

</head>

<body>

<header>

<h1>Мастерская Тани</h1>

<p class="subtitle">

Меньше рутины. Больше творчества.

</p>

</header>

<div class="avatar">

Ваше фото

</div>

<div class="container">

<a class="button">💎 Новое украшение</a>

<a class="button">📝 Карточки ЯМ</a>

<a class="button">📱 Социальные сети</a>

<a class="button">🎥 Rutube</a>

<a class="button">📚 Каталог украшений</a>

<a class="button">🤖 Помощник</a>

<div class="card">

<h2>✨ Украшение дня</h2>

<br>

<p>

Здесь будет отображаться выбранное украшение.

</p>

</div>

</div>

<footer>

Создано с ❤️ специально для Тани

</footer>

</body>

</html>
